[summary]
es = "Abre un .skp conservando su árbol de componentes y sus datos de componentes dinámicos, y exporta el dibujo a .skp. La exportación pide un .skp en blanco, que no se incluye (se descarga desde OpenSKP o se elige un archivo)."
en = "Opens a .skp keeping its component tree and its Dynamic Components data, and exports the drawing to .skp. Exporting needs a blank .skp that is not included (downloaded from OpenSKP, or chosen as a file)."
pt = "Abre um .skp mantendo a árvore de componentes e os dados de componentes dinâmicos, e exporta o desenho para .skp. A exportação precisa de um .skp em branco, não incluído (baixado do OpenSKP ou escolhido como arquivo)."

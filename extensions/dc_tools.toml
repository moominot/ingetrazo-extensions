es = "Opciones, atributos y fórmulas de componentes dinámicos al estilo SketchUp: crea componentes con fórmulas, cambia sus opciones y se redibujan como en SketchUp, también dentro de un grupo abierto. Con ayuda (?) que explica cada función."
